

name: Testes automatizados

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de teste
        run: python -m pip install pytest pytest-cov

      - name: Executar testes e cobertura
        run: python -m pytest -v --cov=main --cov-report=term-missing --cov-report=html

      - name: Salvar relatorio de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-cobertura
          path: htmlcov/
